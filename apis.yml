name: Storability
description: Storability Software was an enterprise storage resource management (SRM) company founded
  in 2000 and headquartered in Southborough, Massachusetts. It built software to simplify and centralize
  the management of complex, multi-site, multi-vendor storage infrastructures, raising roughly $67M from
  investors including Battery Ventures, Lightspeed Venture Partners, and Madison Dearborn Partners. The
  company was acquired by Storage Technology Corporation (StorageTek) on October 11, 2004, and no longer
  operates as an independent entity. It has no surviving website, developer portal, or public API surface.
